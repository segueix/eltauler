name: Temporary Antidote feedback executor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/antidote-live-comments-alerts' && !contains(github.event.pull_request.title, '[feedback aplicat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/antidote-live-comments-alerts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Antidote feedback patch
        run: python .github/scripts/apply_antidote_feedback.py
      - name: Check app syntax
        run: node --check app.js
      - name: Run tests
        run: npm test -- --runInBand
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-antidote-live-feedback.yml .github/antidote-feedback-trigger.txt .github/scripts/apply_antidote_feedback.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rival Antídot: corregeix el panell i valida la sintaxi"
          git push origin HEAD:codex/antidote-live-comments-alerts
