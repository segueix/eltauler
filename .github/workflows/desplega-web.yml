name: Publica El Tauler i Remigi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa El Tauler
        uses: actions/checkout@v4
        with:
          path: site

      - name: Baixa Remigi
        uses: actions/checkout@v4
        with:
          repository: segueix/remigi
          path: remigi-src

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remigi-src/package-lock.json

      - name: Instal·la Remigi
        working-directory: remigi-src
        run: npm ci

      - name: Compila Remigi per eltauler.cat/remigi
        working-directory: remigi-src
        env:
          BASE_PATH: /remigi/
        run: npm run build -w @remigi/web

      - name: Incorpora Remigi dins El Tauler
        run: |
          rm -rf site/remigi
          mkdir -p site/remigi
          cp -R remigi-src/apps/web/dist/. site/remigi/

      - name: Afegeix l'accés a Remigi a la portada
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')

          topbar = '<div class="home-topbar">'
          remigi_link = '''<div class="home-topbar">
                <a class="remigi-home-link" href="/remigi/" target="_self" aria-label="Obre Remigi" title="Remigi">
                    <img src="/remigi/icona-192.png" alt="Remigi">
                </a>'''

          if 'class="remigi-home-link"' not in html:
              if topbar not in html:
                  raise SystemExit('No s’ha trobat la barra superior de la portada')
              html = html.replace(topbar, remigi_link, 1)

          css = '''
        /* Accés a Remigi, a dalt a l’esquerra de la portada */
        #start-screen .home-topbar {
            position: relative !important;
            padding-left: 52px;
            min-height: 42px;
        }
        .remigi-home-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            overflow: hidden;
            border: 1px solid rgba(201, 162, 39, 0.42);
            background: rgba(0,0,0,0.18);
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            cursor: pointer;
            z-index: 2;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }
        .remigi-home-link img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .remigi-home-link:hover,
        .remigi-home-link:focus-visible {
            transform: translateY(-50%) scale(1.06);
            border-color: var(--accent-gold);
            box-shadow: 0 5px 14px rgba(0,0,0,0.35);
            outline: none;
        }
        body.epaper-mode .remigi-home-link {
            border-color: #999;
            box-shadow: none;
        }
        @media (max-width: 420px) {
            #start-screen .home-topbar { padding-left: 46px; min-height: 38px; }
            .remigi-home-link { width: 38px; height: 38px; border-radius: 10px; }
        }
'''
          css_marker = '</style>'
          if '.remigi-home-link {' not in html:
              if css_marker not in html:
                  raise SystemExit('No s’ha trobat el final dels estils de la portada')
              html = html.replace(css_marker, css + '    </style>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara el lloc
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
