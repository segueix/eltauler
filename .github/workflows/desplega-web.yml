name: Publica El Tauler i Remigi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa El Tauler
        uses: actions/checkout@v4
        with:
          path: site

      # Sempre incorpora l'última versió de main de Remigi al domini eltauler.cat/remigi/.
      - name: Baixa Remigi
        uses: actions/checkout@v4
        with:
          repository: segueix/remigi
          path: remigi-src

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remigi-src/package-lock.json

      - name: Instal·la Remigi
        working-directory: remigi-src
        run: npm ci

      - name: Afegeix l'accés a El Tauler dins Remigi
        run: python site/scripts/inject-tauler-link-remigi.py remigi-src/apps/web/src/screens/GameScreen.tsx

      - name: Compila Remigi per eltauler.cat/remigi
        working-directory: remigi-src
        env:
          BASE_PATH: /remigi/
        run: npm run build -w @remigi/web

      - name: Incorpora Remigi dins El Tauler
        run: |
          rm -rf site/remigi
          mkdir -p site/remigi
          cp -R remigi-src/apps/web/dist/. site/remigi/

      - name: Afegeix l'accés a Remigi a la portada
        run: python site/scripts/inject-remigi-link.py site/index.html

      - name: Optimitza la portada per jugar a escacs
        run: python site/scripts/inject-seo.py site/index.html

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara el lloc
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
