name: Apply calibratge express

on:
  push:
    branches:
      - agent/calibratge-express
    paths:
      - '.github/workflows/apply-calibratge-express.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[calibratge-express-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calibratge-express
          fetch-depth: 0

      - name: Apply calibration flow change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          original = text

          replacements = {
              'const CALIBRATION_GAME_COUNT = 5;': 'const CALIBRATION_GAME_COUNT = 1;\nconst EXPRESS_CALIBRATION_GAME_COUNT = 3;',
              'nivell real en 5 partides.': 'nivell inicial en 1 partida obligatòria; les 3 següents continuen afinant-lo en mode exprés, sense bloquejar l’app.',
              'const LEAGUE_UNLOCK_MIN_GAMES = CALIBRATION_GAME_COUNT + 1;': 'const LEAGUE_UNLOCK_MIN_GAMES = CALIBRATION_GAME_COUNT;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'No s’ha trobat el patró obligatori: {old}')
              text = text.replace(old, new, 1)

          # La finestra adaptativa existent ja és de tres partides. Deixem explícit
          # que és el calibratge exprés immediatament posterior al calibratge inicial.
          marker = 'const CONTINUOUS_ADJUST_CONFIG = {\n    WINDOW_SIZE: 3,'
          if marker not in text:
              raise SystemExit('No s’ha trobat CONTINUOUS_ADJUST_CONFIG.WINDOW_SIZE')
          text = text.replace(
              marker,
              '// Les tres primeres partides lliures després del calibratge inicial actuen com a calibratge exprés.\n'
              '// L’app ja queda desbloquejada, però aquesta finestra accelera l’ajust del ROC sense interrompre el joc.\n'
              'const CONTINUOUS_ADJUST_CONFIG = {\n    WINDOW_SIZE: EXPRESS_CALIBRATION_GAME_COUNT,',
              1,
          )

          # Actualitza textos literals habituals si existeixen, sense exigir-los.
          text = text.replace('5 partides de calibratge', '1 partida inicial de calibratge')
          text = text.replace('cinc partides de calibratge', 'una partida inicial de calibratge')
          text = text.replace('Partida de calibratge 1 de 5', 'Partida inicial de calibratge')

          if text == original:
              raise SystemExit('No s’ha aplicat cap canvi a app.js')
          app.write_text(text, encoding='utf-8')

          # Bump de versions perquè la PWA no conservi app.js antic.
          index = Path('index.html')
          idx = index.read_text(encoding='utf-8')
          idx2 = re.sub(r"window\.APP_VERSION = '1\.0\.26';", "window.APP_VERSION = '1.0.27';", idx, count=1)
          idx2 = re.sub(r'app\.js\?v=1\.0\.45', 'app.js?v=1.0.46', idx2, count=1)
          if idx2 == idx:
              raise SystemExit('No s’ha pogut actualitzar la versió a index.html')
          index.write_text(idx2, encoding='utf-8')

          # Actualitza la cache del service worker si hi ha una versió explícita.
          sw = Path('sw.js')
          if sw.exists():
              sw_text = sw.read_text(encoding='utf-8')
              sw_new = re.sub(r'(CACHE_NAME\s*=\s*[\'\"])([^\'\"]+)([\'\"])',
                              lambda m: m.group(1) + m.group(2) + '-calibratge-express' + m.group(3),
                              sw_text, count=1)
              if sw_new != sw_text:
                  sw.write_text(sw_new, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          npm test -- --runInBand

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Reduce initial calibration to one game [calibratge-express-applied]"
          git push origin agent/calibratge-express
