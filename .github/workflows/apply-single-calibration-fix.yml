name: Apply single-game calibration fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-single-calibration-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calibratge-express
          fetch-depth: 0

      - name: Apply the real calibration change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          original = text

          required = {
              'const CALIBRATION_GAME_COUNT = 5;': 'const CALIBRATION_GAME_COUNT = 1;\nconst EXPRESS_CALIBRATION_GAME_COUNT = 3;',
              'const LEAGUE_UNLOCK_MIN_GAMES = CALIBRATION_GAME_COUNT + 1;': 'const LEAGUE_UNLOCK_MIN_GAMES = CALIBRATION_GAME_COUNT;',
              'const CONTINUOUS_ADJUST_CONFIG = {\n    WINDOW_SIZE: 3,': '// Les tres primeres partides normals després del ROC inicial formen el calibratge exprés.\nconst CONTINUOUS_ADJUST_CONFIG = {\n    WINDOW_SIZE: EXPRESS_CALIBRATION_GAME_COUNT,',
          }
          for old, new in required.items():
              if old not in text:
                  raise SystemExit(f'Patró obligatori no trobat: {old}')
              text = text.replace(old, new, 1)

          text = text.replace(
              'nivell real en 5 partides.',
              'nivell inicial en una partida; les tres següents l’afinen sense bloquejar l’app.',
              1,
          )
          text = text.replace(
              'const CALIBRATION_STEPS = [220, 160, 110, 80]; // passos decreixents (transicions partida 1→2…4→5)',
              'const CALIBRATION_STEPS = [220, 160, 110, 80]; // compatibilitat amb historials antics; el calibratge obligatori ara és d’una partida',
              1,
          )

          # Els usuaris que ja havien completat una partida amb l’antic flux de cinc
          # han de rebre immediatament un ROC calculat, no només quedar desbloquejats amb ROC 50.
          load_marker = '    if ((calibrationProfile || calibratgeComplet || calibrationGames.length >= CALIBRATION_GAME_COUNT)) {'
          if load_marker not in text:
              raise SystemExit('No s’ha trobat la condició de migració del calibratge a loadStorage')
          migration = '''    // Migració del flux antic (5 partides) al nou (1 partida): si ja hi ha una\n    // partida desada però encara no existia perfil, calcula i mostra ara el ROC inicial.\n    if (!calibrationProfile && calibrationGames.length >= CALIBRATION_GAME_COUNT) {\n        const migratedRoc = estimateCalibrationRoc();\n        userELO = Math.max(ELO_MIN, migratedRoc);\n        currentElo = userELO;\n        calibrationRocFloor = userELO;\n        calibrationProfile = {\n            roc: userELO,\n            provisional: true,\n            expressCalibrationGames: EXPRESS_CALIBRATION_GAME_COUNT,\n            completedAt: new Date().toISOString(),\n            games: calibrationGames.slice()\n        };\n        // Desa la migració quan loadStorage hagi acabat de carregar la resta de dades.\n        setTimeout(() => saveStorage(), 0);\n    }\n\n'''
          text = text.replace(load_marker, migration + load_marker, 1)

          # El perfil creat en acabar la primera partida identifica el ROC com a inicial/provisional.
          profile_marker = '    calibrationProfile = {\n        roc: userELO,'
          if profile_marker not in text:
              raise SystemExit('No s’ha trobat calibrationProfile a finalizeCalibrationFromGames')
          text = text.replace(
              profile_marker,
              '    calibrationProfile = {\n        roc: userELO,\n        provisional: true,\n        expressCalibrationGames: EXPRESS_CALIBRATION_GAME_COUNT,',
              1,
          )

          # Missatge visible immediatament després de la primera partida.
          reveal_pattern = re.compile(r"statusEl\.text\(`Calibratge completat! El teu nivell inicial és: \$\{rocValue\} ROC ♟️`\)")
          text, reveal_count = reveal_pattern.subn(
              "statusEl.text(`Primera partida completada! ROC inicial: ${rocValue}. Les ${EXPRESS_CALIBRATION_GAME_COUNT} partides següents l’afinaran sense bloquejar cap opció. ♟️`)",
              text,
              count=1,
          )
          if reveal_count != 1:
              raise SystemExit('No s’ha pogut actualitzar el missatge de revelació del ROC')

          # Neteja textos literals antics si encara n’hi ha.
          replacements = {
              '5 partides de calibratge': '1 partida inicial de calibratge',
              'cinc partides de calibratge': 'una partida inicial de calibratge',
              'Partida de calibratge 1 de 5': 'Partida inicial de calibratge',
              'Completa 5 partides': 'Completa la partida inicial',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          if text == original:
              raise SystemExit('No s’ha aplicat cap canvi a app.js')
          app.write_text(text, encoding='utf-8')

          # Força l’actualització de la PWA i d’app.js als dispositius que tenien la versió antiga.
          index = Path('index.html')
          idx = index.read_text(encoding='utf-8')
          idx = re.sub(r"window\.APP_VERSION = '1\.0\.26';", "window.APP_VERSION = '1.0.27';", idx, count=1)
          idx = re.sub(r'app\.js\?v=1\.0\.45', 'app.js?v=1.0.46', idx, count=1)
          index.write_text(idx, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_new, n = re.subn(r"const SW_VERSION = '([^']+)'", "const SW_VERSION = '2.3-calibratge-1-partida'", sw_text, count=1)
          if n == 0:
              sw_new, n = re.subn(r"(CACHE_NAME\s*=\s*['\"])([^'\"]+)(['\"])", r"\1\2-calibratge-1-partida\3", sw_text, count=1)
          if n == 0:
              raise SystemExit('No s’ha trobat la versió de cache a sw.js')
          sw.write_text(sw_new, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check app.js
          npm test -- --runInBand

      - name: Commit and push to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Fix calibration to unlock after one game and show initial ROC"
          git push origin HEAD:agent/calibratge-express
